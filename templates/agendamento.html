<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Agendamento RU</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input[type="text"], input[type="password"] { width: 250px; padding: 5px; }
        .dias { margin-top: 10px; }
        .checkbox-group { margin-bottom: 10px; }
    </style>
</head>
<body>
    <h2>Agendamento RU</h2>
    <form id="agendamentoForm" method="POST" action="/agendar">
        <div class="form-group">
            <label for="usuario">Usuário:</label>
            <input type="text" id="usuario" name="usuario" required>
        </div>
        <div class="form-group">
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>
        </div>
        <div class="form-group">
            <label>
                <input type="checkbox" id="moradia" name="moradia" value="sim">
                Moradia Estudantil
            </label>
        </div>
        <div class="form-group">
            <label for="dias">Selecione os dias para agendar:</label>
            <input type="text" id="dias" name="dias" placeholder="Clique para escolher" readonly required>
        </div>
        <div class="form-group">
            <label>Refeições disponíveis:</label>
            <div id="refeicoes" class="checkbox-group">
                <label><input type="checkbox" name="refeicao" value="cafe" id="cafe" disabled> Café da manhã</label>
                <label><input type="checkbox" name="refeicao" value="almoco" id="almoco" checked> Almoço</label>
                <label><input type="checkbox" name="refeicao" value="janta" id="janta" disabled> Janta</label>
            </div>
        </div>
        <button type="submit">Agendar</button>
    </form>

    <div id="resposta" style="margin-top:20px;"></div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
        flatpickr("#dias", {
            mode: "multiple",
            dateFormat: "d/m/Y",
            conjunction: ","
        });

        const moradia = document.getElementById('moradia');
        const cafe = document.getElementById('cafe');
        const almoco = document.getElementById('almoco');
        const janta = document.getElementById('janta');

        function atualizaRefeicoes() {
            if (moradia.checked) {
                cafe.disabled = false;
                janta.disabled = false;
            } else {
                cafe.checked = false;
                cafe.disabled = true;
                janta.checked = false;
                janta.disabled = true;
            }
        }

        moradia.addEventListener('change', atualizaRefeicoes);
        window.addEventListener('DOMContentLoaded', atualizaRefeicoes);
    </script>
</body>
</html>
